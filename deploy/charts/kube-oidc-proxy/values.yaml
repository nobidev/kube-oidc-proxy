# Default values for kube-oidc-proxy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/nobidev/kube-oidc-proxy
  # Defaults to the chart appVersion. Published charts pin the immutable
  # <appVersion>-<sha7> tag of the commit they were built from.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443
  annotations:
    # You can use this field to add annotations to the Service.
    # Define it in a key-value pairs. E.g.
    # service.beta.kubernetes.io/aws-load-balancer-internal: true

  loadBalancerIP: ""
  loadBalancerSourceRanges: []

tls:
  # `secretName` must be a name of Secret of TLS type. If not provided a
  # self-signed certificate will get generated.
  secretName:
  # `certManager` if you have cert-manager in your cluster and dont want to manage manually
  certManager: false
  # `selfSigned` if you have cert-manager and perfer or not to use use default issuer or generate by using other issuer
  selfSigned: true
  # `issuerName` if `selfSigned` is false, you should add your own Issuer
  issuerName:

# These values needs to be set in overrides in order to get kube-oidc-proxy
# working.
oidc:
  # A minimal configuration requires setting clientId, issuerUrl and usernameClaim
  # values.
  clientId: ""
  issuerUrl: ""
  usernameClaim: ""

  # PEM encoded value of CA cert that will verify TLS connection to
  # OIDC issuer URL. If not provided, default hosts root CA's will be used.
  caPEM:

  # Path (inside the container) of a CA bundle used to verify the TLS connection
  # to the OIDC issuer URL. Only used when `caPEM` is not set. Mount a custom
  # bundle via `extraVolumes`/`extraVolumeMounts` and point this to it, or set
  # to "" to not pass `--oidc-ca-file` at all.
  caFile: /etc/ssl/certs/ca-certificates.crt

  usernamePrefix:
  groupsClaim:
  groupsPrefix:

  signingAlgs:
    - RS256
  requiredClaims: {}

# Restrict which OIDC users/groups may use the proxy. Values are matched after
# usernamePrefix/groupsPrefix are applied. Regular expressions (Go RE2 syntax)
# are anchored: they must match the whole value. Rejected requests get 403.
# Username/group lists also apply to impersonation targets (Impersonate-User /
# Impersonate-Group). Avoid "$(" in expressions (Kubernetes expands $(VAR) in
# container args).
#
# Default: usernames and groups may only contain ASCII letters, digits and "-".
# This blocks "system:*" names/groups (e.g. system:admin, system:masters,
# service accounts) as well as e-mail usernames and prefixes containing ":".
# Set the lists to [] to disable.
identityFilter:
  # Username must match at least one expression (if any are set).
  allowedUsernameRegex:
    - '[A-Za-z0-9-]+'
  # Username must not match any expression. Takes precedence over allow.
  deniedUsernameRegex: []
  #  - 'system:.*'
  # Every group of the user must match at least one expression (if any are set).
  allowedGroupRegex:
    - '[A-Za-z0-9-]+'
  # No group of the user may match any expression. Takes precedence over allow.
  deniedGroupRegex: []
  #  - 'system:masters'
  # Exact group names the OIDC user must be a member of, ALL of them.
  # Not applied to impersonation targets.
  requiredGroups: []
  #  - 'oidc:k8s-users'

# To enable token passthrough feature
# https://github.com/jetstack/kube-oidc-proxy/blob/master/docs/tasks/token-passthrough.md
tokenPassthrough:
  enabled: false
  audiences: []

# To add extra impersonation headers
# https://github.com/jetstack/kube-oidc-proxy/blob/master/docs/tasks/extra-impersonation-headers.md
extraImpersonationHeaders:
  clientIP: false
  #headers: key1=foo,key2=bar,key1=bar

extraArgs: {}
  #audit-log-path: /audit-log
  #audit-policy-file: /audit/audit.yaml

extraVolumeMounts: {}
  #- name: audit
  #  mountPath: /audit
  #  readOnly: true

extraVolumes: {}
  #- configMap:
      #defaultMode: 420
      #name: kube-oidc-proxy-policy
    #name: audit

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []

  # ingressClassName: ''

  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Allows setting the Deployment update strategy
#rollingUpdateStrategy:
#  type: RollingUpdate
#  rollingUpdate:
#    maxSurge: 34%
#    maxUnavailable: 33%

# Enable Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  #

initContainers: []

nodeSelector: {}

tolerations: []

affinity: {}
